[package]
name = "burpwn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "burpwn CLI: clap subcommand tree, JSON envelope output, orchestration"

[dependencies]
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
burpwn-error.workspace = true
burpwn-store.workspace = true
burpwn-tls.workspace = true
burpwn-proxy.workspace = true
burpwn-sandbox.workspace = true
burpwn-wrap.workspace = true
async-trait.workspace = true
libc.workspace = true
# Already in the workspace lock (a burpwn-proxy dep); used by `session auth`
# token extraction + injection-rule building.
regex = "1.10"
# Already in the workspace lock (a burpwn-tls dep); used for RFC3339 timestamps
# in debug reports.
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
rustls.workspace = true
# `test-util` enables `#[tokio::test(start_paused = true)]` for timeout tests.
tokio = { workspace = true, features = ["test-util"] }
